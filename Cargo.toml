[package]
name = "shohei"
version = "0.4.1"
edition = "2021"
rust-version = "1.75"
description = "Next-generation DNS diagnostic CLI: visualize DNSSEC chain-of-trust, DoH/DoT/DoQ, and iterative resolution paths in the terminal"
license = "MIT"
repository = "https://github.com/kent-tokyo/shohei"
documentation = "https://docs.rs/shohei"
readme = "README.md"
keywords = ["dns", "dnssec", "diagnostic", "doh", "dot"]
categories = ["command-line-utilities", "network-programming"]
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
exclude = [".github", "tests/fixtures"]

[lib]
name = "shohei"
path = "src/lib.rs"

[[bin]]
name = "shohei"
path = "src/main.rs"

[dependencies]
hickory-resolver = { version = "0.26", features = [
    "dnssec-ring",
    "https-ring",
    "tls-ring",
    "quic-ring",
    "tokio",
    "webpki-roots",
    "system-config",
] }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = "7"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
x509-parser = "0.16"
hex = "0.4"
sha2 = "0.10"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
