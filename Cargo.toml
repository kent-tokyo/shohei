[package]
name = "shohei"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
description = "Infrastructure diagnostics library: DNS, DNSSEC, TLS certificate inspection, email security, DNS propagation, and MCP-integrated AI agent support"
license = "MIT"
repository = "https://github.com/kent-tokyo/shohei"
documentation = "https://docs.rs/shohei"
readme = "README.md"
keywords = ["dns", "tls", "library", "mcp", "async"]
categories = ["command-line-utilities", "network-programming", "api-bindings", "development-tools"]
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
exclude = [".github", "tests/fixtures"]

[lib]
name = "shohei"
path = "src/lib.rs"

[[bin]]
name = "shohei"
path = "src/main.rs"

[[bin]]
name = "shohei-mcp"
path = "src/bin/shohei_mcp.rs"

[dependencies]
hickory-resolver = { version = "0.26", features = [
    "dnssec-ring",
    "https-ring",
    "tls-ring",
    "quic-ring",
    "tokio",
    "webpki-roots",
    "system-config",
] }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = "7"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
x509-parser = "0.16"
hex = "0.4"
sha2 = "0.10"
rmcp = { version = "1.7", features = ["transport-io"] }
schemars = "0.8"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
ocsp = "0.3"

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
