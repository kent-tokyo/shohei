[package]
name = "shohei"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Next-generation DNS diagnostic CLI: visualize DNSSEC chain-of-trust, DoH/DoT, and iterative resolution paths in the terminal"
license = "MIT"
repository = "https://github.com/kent-tokyo/shohei"
homepage = "https://github.com/kent-tokyo/shohei"
documentation = "https://docs.rs/shohei"
readme = "README.md"
keywords = ["dns", "dnssec", "cli", "network", "doh"]
categories = ["command-line-utilities", "network-programming"]
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
exclude = [".github", "tests/fixtures"]

[lib]
name = "shohei"
path = "src/lib.rs"

[[bin]]
name = "shohei"
path = "src/main.rs"

[dependencies]
hickory-resolver = { version = "0.26", features = [
    "dnssec-ring",
    "https-ring",
    "tls-ring",
    "tokio",
    "webpki-roots",
    "system-config",
] }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = "7"
indicatif = "0.18"
ptree = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "http2",
] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
